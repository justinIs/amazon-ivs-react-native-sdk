# CI

name: CI

on:
  pull_request:
    branches: [main, feat/sdk-v1]
  push:
    branches: [main, feat/sdk-v1]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Jest (unit + parity)
        run: yarn test

      - name: Build library (bob)
        run: yarn prepare

  android:
    name: Android assemble (best-effort)
    runs-on: ubuntu-latest
    needs: js
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn prepare

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble example debug APK
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload example APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: example-android-debug-apk
          path: example/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  android-unit:
    name: Android mapping unit tests
    runs-on: ubuntu-latest
    needs: js
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run JUnit mapping tests
        working-directory: example/android
        run: ./gradlew :amazon-ivs-react-native-sdk:testDebugUnitTest --no-daemon

  ios-note:
    name: iOS build note
    runs-on: ubuntu-latest
    needs: js
    steps:
      - name: iOS build requirements
        run: |
          echo "iOS builds require macOS runners, CocoaPods, and RCT_NEW_ARCH_ENABLED=1."
          echo "Run locally: cd example/ios && pod install && xcodebuild -workspace *.xcworkspace -scheme *Example* -sdk iphonesimulator -configuration Debug build"
          echo "Native XCTest: ios/Tests/IvsMappingTests.mm via Xcode test action on macOS."
