buildscript {
  ext.IvsRealtime = [
    // Keep in sync with the Kotlin/AGP versions React Native ships with
    // (see @react-native/gradle-plugin gradle/libs.versions.toml).
    kotlinVersion: "2.1.20",
    // Amazon IVS real-time broadcast SDK requires Android 9.0+ (API 28).
    minSdkVersion: 28,
    compileSdkVersion: 36,
    // Pinned IVS broadcast SDK version (Maven Central: com.amazonaws:ivs-broadcast).
    ivsBroadcastVersion: "1.43.0"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return IvsRealtime[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.ivsrealtime"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Amazon IVS real-time SDK — the `stages` classifier (closed-source AAR from
  // Maven Central). This variant is a superset of the plain `ivs-broadcast` AAR:
  // it adds the Stage API (Stage, Stage.Strategy, StageRenderer, ParticipantInfo)
  // on top of DeviceDiscovery / ImageDevice / ImagePreviewView / BroadcastSession.
  implementation "com.amazonaws:ivs-broadcast:${getExtOrDefault('ivsBroadcastVersion')}:stages@aar"
}
